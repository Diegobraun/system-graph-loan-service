name: system-graph

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  EXTRACTOR_URL: https://github.com/Diegobraun/system-graph-poc/releases/download/v0.1.0/graph-extractor.jar

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USER: ${{ secrets.NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: mvn -B -q compile

      - name: Download graph-extractor
        run: curl -fsSL -o /tmp/graph-extractor.jar "$EXTRACTOR_URL"

      - name: Extract service graph
        run: java -jar /tmp/graph-extractor.jar extract --project . --out service-graph.json

      - uses: actions/upload-artifact@v7
        with:
          name: service-graph
          path: service-graph.json

      - name: Ingest into Neo4j
        if: env.NEO4J_URI != ''
        run: java -jar /tmp/graph-extractor.jar ingest service-graph.json
